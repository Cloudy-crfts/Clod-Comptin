<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello!</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
        }
        .greeting {
            font-size: 1.5rem;
            margin: 0.5rem;
            opacity: 0;
            animation: fadein 0.8s forwards;
        }
        @keyframes fadein {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>🌍 Hello World!</h1>
    <div id="greetings"></div>

    <script>
        const hellos = [
            "Hello",        // English
            "Hola",         // Spanish
            "Bonjour",      // French
            "Ciao",         // Italian
            "Hallo",        // German
            "こんにちは",    // Japanese
            "안녕하세요",    // Korean
            "你好",          // Chinese
            "Olá",          // Portuguese
            "Namaste"       // Hindi
        ];

        const container = document.getElementById("greetings");
        hellos.forEach((hello, i) => {
            const p = document.createElement("p");
            p.textContent = hello;
            p.className = "greeting";
            p.style.animationDelay = `${i * 0.2}s`;
            container.appendChild(p);
        });
    </script>
</body>
</html>
